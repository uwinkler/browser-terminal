<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Terminal</title>
    
    <!-- xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="session-switcher" id="session-switcher">
            <button class="switcher-toggle" id="switcher-toggle" title="Einstellungen ein-/ausblenden">⚙️</button>
            <div class="session-switcher-content">
                <span class="switcher-icon" title="Farbschema">🎨</span>
                <select id="theme-select" title="Farbschema wechseln">
                    <optgroup label="Dunkle Schemen">
                        <option value="classic">Black & White</option>
                        <option value="dracula">Dracula</option>
                        <option value="onedark">One Dark</option>
                        <option value="nord">Nord</option>
                        <option value="gruvbox">Gruvbox Dark</option>
                        <option value="solarized-dark">Solarized Dark</option>
                        <option value="retro-amber">Retro Amber</option>
                        <option value="retro-green">Retro Green</option>
                    </optgroup>
                    <optgroup label="Helle Schemen">
                        <option value="solarized-light">Solarized Light</option>
                        <option value="github-light">GitHub Light</option>
                        <option value="onelight">One Light</option>
                        <option value="gruvbox-light">Gruvbox Light</option>
                        <option value="papercolor-light">PaperColor Light</option>
                    </optgroup>
                </select>
                
                <span class="switcher-separator">|</span>
                
                <span class="switcher-icon" title="tmux-Session">🐚</span>
                <select id="session-select" title="tmux-Session wechseln">
                    <option value="">— Session wählen —</option>
                </select>
                <button id="session-refresh" title="Sessions neu laden">⟳</button>
                <button id="session-add" title="Neue tmux-Session erstellen">+</button>
                
                <span class="switcher-separator">|</span>
                
                <span class="switcher-icon" title="Schriftgröße">🔍</span>
                <button id="font-dec" title="Schriftgröße verkleinern">A-</button>
                <span id="font-size-display" style="font-size: 0.75rem; min-width: 18px; text-align: center; user-select: none;">14</span>
                <button id="font-inc" title="Schriftgröße vergrößern">A+</button>
            </div>
        </div>
        <div class="terminal-container">
            <div id="terminal"></div>
        </div>
        
    </div>

    <!-- KI-Chat: Toggle-Button + Panel -->
    <button id="chat-toggle" class="chat-toggle" title="KI-Chat öffnen/schließen (Ctrl+I)">💬</button>

    <aside id="chat-panel" class="chat-panel" aria-hidden="true">
        <header class="chat-header">
            <span class="chat-dot"></span>
            <span class="chat-title">Terminal KI-Chat</span>
            <button class="chat-icon" id="chat-send-buffer" title="Aktuellen Terminal-Buffer ans Modell senden">📋</button>
            <button class="chat-icon" id="chat-clear" title="Verlauf leeren">🗑️</button>
            <button class="chat-icon" id="chat-settings-btn" title="Einstellungen">⚙️</button>
            <button class="chat-icon" id="chat-close" title="Schließen">✕</button>
        </header>

        <div id="chat-settings" class="chat-settings">
            <label for="chat-api-key">OpenAI API-Key</label>
            <input type="password" id="chat-api-key" placeholder="sk-…  (leer lassen, wenn der Server OPENAI_API_KEY setzt)" autocomplete="off">
            <label for="chat-model">Modell</label>
            <input id="chat-model" list="chat-model-options" placeholder="gpt-5.5" autocomplete="off">
            <datalist id="chat-model-options">
                <option value="gpt-5.5"></option>
                <option value="gpt-5.5-nano"></option>
                <option value="gpt-5"></option>
                <option value="gpt-4o-mini"></option>
                <option value="gpt-4o"></option>
                <option value="gpt-4.1"></option>
            </datalist>
            <button class="chat-primary" id="chat-save-settings">Speichern</button>
            <p class="chat-hint">Der Key wird lokal im Browser (localStorage) gespeichert und nur an deinen
                eigenen Server-Proxy geschickt. Nur für persönliche Nutzung.</p>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="chat-empty" id="chat-empty">
                Frag mich etwas zu deinem Terminal.<br>
                Die letzten 200 Zeilen Ausgabe werden automatisch als Kontext mitgeschickt.
            </div>
        </div>

        <div id="chat-status" class="chat-status"></div>

        <div class="chat-composer">
            <textarea id="chat-input" rows="1" placeholder="Nachricht … (Enter = senden, Shift+Enter = Zeilenumbruch)"></textarea>
            <button class="chat-primary" id="chat-send">Senden</button>
        </div>
    </aside>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- xterm.js -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="client.js"></script>
    <script src="chat.js"></script>
</body>
</html>
